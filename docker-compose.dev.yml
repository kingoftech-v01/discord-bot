# Docker Compose - Development Configuration
#
# Starts the bot, dashboard, and Redis for local development.
# Source code is mounted as volumes for hot-reload (no rebuild needed on code changes).
# The bot and dashboard share the SQLite database via ./data/bot.db.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build      # Start all services
#   docker-compose -f docker-compose.dev.yml logs -f bot      # Follow bot logs
#   docker-compose -f docker-compose.dev.yml down             # Stop all services
#
# Prerequisites:
#   - Copy .env.example to .env and fill in DISCORD_TOKEN (minimum)
#   - Docker and Docker Compose v2 installed

version: '3.8'

services:
  # Discord Bot
  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    container_name: discord-bot-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=True
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for hot reload
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - bot-network

  # Django Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: discord-dashboard-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_PATH=/app/data/bot.db
    ports:
      - "8000:8000"
    volumes:
      - ./dashboard:/app
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - bot-network
    command: python manage.py runserver 0.0.0.0:8000

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: discord-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bot-network
    command: redis-server --appendonly yes

networks:
  bot-network:
    driver: bridge

volumes:
  redis-data:
